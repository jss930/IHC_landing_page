<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ssBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <pattern id="gridSmall" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff3333" stroke-width="0.3" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#ssBg)"/>
  <rect width="100%" height="100%" fill="url(#gridSmall)"/>
  
  <!-- Marco VR -->
  <rect x="60" y="40" width="1160" height="640" rx="12" fill="none" stroke="#ff3333" stroke-width="3" opacity="0.3"/>
  <rect x="64" y="44" width="1152" height="632" rx="10" fill="#0d0d14" stroke="#2a2a3f" stroke-width="1"/>
  
  <!-- Vista de la bomba en primera persona -->
  <g transform="translate(640, 360)">
    <!-- Mesa virtual -->
    <ellipse cx="0" cy="180" rx="300" ry="60" fill="#1a1a1a" stroke="#2a2a3f" stroke-width="1"/>
    <ellipse cx="0" cy="175" rx="295" ry="55" fill="#14141f" stroke="none"/>
    
    <!-- Bomba -->
    <g transform="translate(0, -30)">
      <ellipse cx="0" cy="0" rx="90" ry="110" fill="#1a1a1a" stroke="#ff3333" stroke-width="2"/>
      
      <!-- Caras visibles (perspectiva) -->
      <g fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.6">
        <ellipse cx="0" cy="-75" rx="55" ry="18"/>  <!-- Top face -->
        <ellipse cx="-0" cy="0" rx="60" ry="70"/>   <!-- Front face -->
      </g>
      
      <!-- Timer frontal -->
      <rect x="-45" y="-20" width="90" height="50" rx="6" fill="#0a0a0f" stroke="#ff3333" stroke-width="2"/>
      <text x="0" y="8" font-family="monospace" font-size="22" font-weight="bold" fill="#ff3333" text-anchor="middle" letter-spacing="1">00:00</text>
      
      <!-- Botón rojo -->
      <circle cx="0" cy="95" r="16" fill="#ff3333" filter="drop-shadow(0 0 8px #ff3333)"/>
      <circle cx="0" cy="95" r="10" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    </g>
    
    <!-- Manos VR -->
    <g transform="translate(-200, 120)" fill="#ff3333" opacity="0.15" stroke="#ff3333" stroke-width="1">
      <ellipse cx="0" cy="0" rx="40" ry="60" transform="rotate(-15)"/>
      <ellipse cx="-15" cy="-10" rx="12" ry="30"/>
      <ellipse cx="5" cy="-15" rx="10" ry="25"/>
    </g>
    <g transform="translate(200, 120)" fill="#ffaa00" opacity="0.15" stroke="#ffaa00" stroke-width="1">
      <ellipse cx="0" cy="0" rx="40" ry="60" transform="rotate(15)"/>
      <ellipse cx="15" cy="-10" rx="12" ry="30"/>
      <ellipse cx="-5" cy="-15" rx="10" ry="25"/>
    </g>
  </g>
  
  <!-- HUD elementos -->
  <g fill="#ff3333" font-family="monospace" font-size="14">
    <text x="100" y="100" fill-opacity="0.5">● REC</text>
    <text x="100" y="125" font-size="12" fill-opacity="0.3">MODO: NORMAL</text>
  </g>
  
  <!-- Texto placeholder -->
  <text x="640" y="650" font-family="system-ui, sans-serif" font-size="18" fill="#a0a0b0" text-anchor="middle" font-weight="500">
    SCREENSHOT PLACEHOLDER — Reemplaza en public/images/screenshots/
  </text>
  
  <!-- Badge -->
  <rect x="1000" y="50" width="220" height="40" rx="6" fill="#ff3333" fill-opacity="0.15" stroke="#ff3333" stroke-width="1"/>
  <text x="1110" y="76" font-family="monospace" font-size="12" fill="#ff3333" text-anchor="middle">VR SCREENSHOT 16:9</text>
</svg>