<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0f" stroke="url(#logoGrad)" stroke-width="3"/>
  
  <!-- Bomba estilizada -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Cuerpo principal -->
    <ellipse cx="0" cy="-10" rx="35" ry="45" fill="#1a1a1a" stroke="#ff3333" stroke-width="2"/>
    
    <!-- Líneas de caras (6 puzzles) -->
    <g stroke="#ffaa00" stroke-width="1.5" opacity="0.7">
      <ellipse cx="0" cy="-45" rx="25" ry="8"/>   <!-- Top -->
      <ellipse cx="0" cy="25" rx="25" ry="8"/>    <!-- Bottom -->
      <ellipse cx="-38" cy="-10" rx="8" ry="30"/> <!-- Left -->
      <ellipse cx="38" cy="-10" rx="8" ry="30"/>  <!-- Right -->
      <circle cx="0" cy="-10" r="20"/>             <!-- Front -->
      <circle cx="0" cy="-10" r="20" stroke-dasharray="3,6"/> <!-- Back -->
    </g>
    
    <!-- Timer display -->
    <rect x="-22" y="-18" width="44" height="24" rx="4" fill="#0a0a0f" stroke="#ff3333" stroke-width="1.5"/>
    <text x="0" y="-2" font-family="monospace" font-size="14" font-weight="bold" fill="#ff3333" text-anchor="middle">00:00</text>
    
    <!-- Botón rojo -->
    <circle cx="0" cy="48" r="10" fill="#ff3333"/>
    <circle cx="0" cy="48" r="6" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Anillo de timer exterior -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#ff3333" stroke-width="2" stroke-dasharray="8 12" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Partículas flotantes -->
  <g fill="#ff3333" opacity="0.6">
    <circle cx="40" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="160" cy="30" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="30" cy="160" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="170" cy="170" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" begin="1.5s"/></circle>
  </g>
</svg>