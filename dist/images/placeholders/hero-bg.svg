<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ff3333" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ff3333" stroke-width="0.5" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#glowGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Bomba central estilo low-poly -->
  <g transform="translate(960, 540) scale(1.5)">
    <!-- Esfera principal -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ff3333" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="100" fill="#1a1a1a" stroke="#ff3333" stroke-width="2"/>
    
    <!-- Caras de la bomba (6 puzzles) -->
    <g fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.6">
      <ellipse cx="0" cy="-80" rx="60" ry="20"/>  <!-- Top -->
      <ellipse cx="0" cy="80" rx="60" ry="20"/>   <!-- Bottom -->
      <ellipse cx="-90" cy="0" rx="20" ry="60"/>  <!-- Left -->
      <ellipse cx="90" cy="0" rx="20" ry="60"/>   <!-- Right -->
      <circle cx="0" cy="0" r="50"/>               <!-- Front -->
      <circle cx="0" cy="0" r="50" stroke-dasharray="5,10"/> <!-- Back -->
    </g>
    
    <!-- Timer en el centro -->
    <g transform="translate(0, 10)">
      <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#0a0a0f" stroke="#ff3333" stroke-width="2"/>
      <text x="0" y="10" font-family="monospace" font-size="28" font-weight="bold" fill="#ff3333" text-anchor="middle" letter-spacing="2">00:00</text>
    </g>
    
    <!-- Botón rojo -->
    <circle cx="0" cy="130" r="18" fill="#ff3333" filter="drop-shadow(0 0 10px #ff3333)"/>
    <circle cx="0" cy="130" r="12" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Texto del título -->
  <text x="960" y="900" font-family="system-ui, sans-serif" font-size="48" font-weight="900" fill="#f0f0f5" text-anchor="middle" letter-spacing="4">
    TICK, TOCK, BOOM!
  </text>
  <text x="960" y="960" font-family="system-ui, sans-serif" font-size="20" fill="#a0a0b0" text-anchor="middle">
    VR BOMB DEFUSAL  •  REEMPLAZA ESTA IMAGEN EN public/images/hero-bg.jpg
  </text>
  
  <!-- Indicador de placeholder -->
  <rect x="1700" y="20" width="200" height="60" rx="8" fill="#ff3333" fill-opacity="0.2" stroke="#ff3333" stroke-width="1"/>
  <text x="1800" y="58" font-family="monospace" font-size="14" fill="#ff3333" text-anchor="middle">PLACEHOLDER</text>
</svg>